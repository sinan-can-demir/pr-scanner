name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
