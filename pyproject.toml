[project]
name = "pr-scanner"
version = "0.0.0"
description = "Static scanner for malicious code in pull requests"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: slow adversarial-input performance tests (run in CI with: pytest -m perf)"]
addopts = "-m 'not perf'"
