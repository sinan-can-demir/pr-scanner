# Scans pull requests for malicious code. Design: docs/adr/0005-action-trust-model.md
#
# Why `pull_request_target` is safe HERE (it is dangerous in most workflows):
#   * GitHub runs this file from the BASE branch, so a pull request cannot edit, disable or
#     reroute the scan, and cannot forge the report the privileged job posts.
#   * We NEVER check out, install, build, import or run anything from the pull request. The PR is
#     read only through the GitHub API, as inert text. Do not add a checkout of the PR head, ever;
#     tests/test_workflow_file.py fails if one appears.
#
# Two jobs, least privilege each:
#   scan:   read-only token, produces report.json, can write nothing to GitHub.
#   report: `checks: write` only, validates report.json as untrusted input, posts one check run.
#           It also runs when the scan crashed, so a failure becomes a failing check, not silence.
#
# Pins: third-party actions by commit SHA; the scanner by commit SHA of this repository. To
# upgrade the scanner, push the new commit first, then change the SHA below in its own PR.
# Required status check name to configure in branch protection: "PR scanner".

name: PR scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install the scanner (pinned commit of the scanner repository, not the pull request)
        run: |
          python3 -m venv "$RUNNER_TEMP/scanner"
          "$RUNNER_TEMP/scanner/bin/pip" install --no-cache-dir --disable-pip-version-check \
            "git+https://github.com/sinan-can-demir/pr-scanner@0360d1ad55958b87ed92773c4d8729c230c32f70"

      - name: Scan the pull request through the API (read-only, nothing is executed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          "$RUNNER_TEMP/scanner/bin/python" -m pr_scanner scan \
            --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/report/report.json"

      - name: Hand the report to the privileged job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-scan-report
          path: ${{ runner.temp }}/report/report.json
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
    steps:
      - name: Install the scanner (pinned commit of the scanner repository, not the pull request)
        run: |
          python3 -m venv "$RUNNER_TEMP/scanner"
          "$RUNNER_TEMP/scanner/bin/pip" install --no-cache-dir --disable-pip-version-check \
            "git+https://github.com/sinan-can-demir/pr-scanner@0360d1ad55958b87ed92773c4d8729c230c32f70"

      - name: Fetch the report (a missing report becomes a failing check below)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-scan-report
          path: ${{ runner.temp }}/report

      - name: Validate the report as untrusted input and publish the check run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/scanner/bin/python" -m pr_scanner report --repo "$REPO" --head-sha "$HEAD_SHA" \
            --report "$RUNNER_TEMP/report/report.json"
